<!DOCTYPE html>
<html lang="eng-uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Stats preview card component</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
        </head>
    <body>
        <div class="container" role="main">
            <div class="image">
                <img src="image-header-mobile.jpg" alt="three girls laughing in their office">
            </div>
            <div class="statistics">
                <h1>Get <span class="color">insight</span> that help your business  grow.</h1>
                <p>Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
            
                <div class="flexcontainer">
                    <div class="stats">
                        <span class="numbers">10k+</span>
                        <span class="themes">Compagnies</span>
                    </div>
                    <div class="stats">
                        <span class="numbers">314</span>
                        <span class="themes">Templates</span>
                    </div>
                    <div class="stats">
                        <span class="numbers">12M+</span>
                        <span class="themes">Queries</span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
